<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waypoints — Travel Journal</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#9992;</span>
      <span class="brand-name">Waypoints</span>
    </div>
    <div class="topbar-actions">
      <button id="newTripBtn" class="btn btn-accent">+ New Trip</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input type="search" id="tripSearch" placeholder="Search trips & entries…" />
      </div>
      <nav id="tripNav"></nav>
    </aside>

    <main class="content" id="content">
      <div class="empty-state" id="emptyState">
        <p class="empty-glyph">&#128506;</p>
        <h2>No trip selected</h2>
        <p>Pick a trip from the list, or start a new one to begin logging entries.</p>
      </div>
    </main>
  </div>
</div>

<!-- Trip modal (create/edit) -->
<div class="modal-backdrop" id="tripModalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tripModalTitle">
    <div class="modal-header">
      <h3 id="tripModalTitle">New Trip</h3>
      <button class="icon-btn" data-close-modal>&times;</button>
    </div>
    <form id="tripForm" class="modal-body">
      <input type="hidden" id="tripId" />
      <label class="field">
        <span>Trip title</span>
        <input type="text" id="tripTitle" required placeholder="e.g. Two Weeks in Portugal" />
      </label>
      <label class="field">
        <span>Destination</span>
        <input type="text" id="tripDestination" required placeholder="e.g. Lisbon & the Algarve" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Start date</span>
          <input type="date" id="tripStart" required />
        </label>
        <label class="field">
          <span>End date</span>
          <input type="date" id="tripEnd" required />
        </label>
      </div>
      <label class="field">
        <span>Cover photo</span>
        <input type="file" id="tripCoverInput" accept="image/*" />
      </label>
      <div class="cover-preview-wrap">
        <img id="tripCoverPreview" class="cover-preview" hidden />
        <button type="button" id="tripCoverClear" class="link-btn" hidden>Remove photo</button>
      </div>
      <label class="field">
        <span>Trip notes <span class="hint">(itinerary ideas, logistics, anything worth remembering)</span></span>
        <textarea id="tripNotes" rows="3" placeholder="Optional"></textarea>
      </label>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="deleteTripBtn" hidden>Delete Trip</button>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-accent">Save Trip</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Entry modal (create/edit) -->
<div class="modal-backdrop" id="entryModalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="entryModalTitle">
    <div class="modal-header">
      <h3 id="entryModalTitle">New Entry</h3>
      <button class="icon-btn" data-close-modal>&times;</button>
    </div>
    <form id="entryForm" class="modal-body">
      <input type="hidden" id="entryId" />
      <div class="type-picker" id="entryTypePicker">
        <button type="button" class="type-chip" data-type="journal">&#128214; Journal</button>
        <button type="button" class="type-chip" data-type="note">&#128221; Note</button>
        <button type="button" class="type-chip" data-type="insight">&#128161; Insight</button>
      </div>
      <label class="field">
        <span>Title</span>
        <input type="text" id="entryTitle" required placeholder="e.g. Getting lost in Alfama" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Date</span>
          <input type="date" id="entryDate" required />
        </label>
        <label class="field">
          <span>Location <span class="hint">(optional)</span></span>
          <input type="text" id="entryLocation" placeholder="e.g. Alfama, Lisbon" />
        </label>
      </div>
      <label class="field">
        <span>Entry</span>
        <textarea id="entryBody" rows="8" required placeholder="Write it up — a short story, a quick note, whatever it needs to be."></textarea>
      </label>
      <label class="field">
        <span>Photos</span>
        <input type="file" id="entryPhotosInput" accept="image/*" multiple />
      </label>
      <div class="photo-grid" id="entryPhotoGrid"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="deleteEntryBtn" hidden>Delete Entry</button>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-accent">Save Entry</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Lightbox for full-size photos -->
<div class="lightbox-backdrop" id="lightboxBackdrop">
  <button class="icon-btn lightbox-close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" alt="" />
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
