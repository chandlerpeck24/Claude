<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — Travel Journal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%A6</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <div>
        <h1>Waypoint</h1>
        <p class="tagline">Travels, past and future</p>
      </div>
    </div>

    <button class="btn btn-primary btn-block" id="newTripBtn">+ New Trip</button>

    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Search trips &amp; entries…">
    </div>

    <nav class="side-nav">
      <button class="side-nav-item" data-view="home">🏠 Home</button>
      <button class="side-nav-item" data-view="notes">🗒️ Notes &amp; Insights</button>
      <button class="side-nav-item" data-view="photos">📷 All Photos</button>
    </nav>

    <div class="trip-groups" id="tripGroups"></div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <main class="main" id="mainView"></main>
</div>

<!-- Trip Form Modal -->
<div class="modal-overlay" id="tripModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="tripModalTitle">New Trip</h2>
      <button type="button" class="modal-close" data-close-modal="tripModalOverlay">×</button>
    </div>
    <form id="tripForm">
      <input type="hidden" id="tripId">
      <label>Trip title
        <input type="text" id="tripTitle" required placeholder="e.g. Kyoto in Autumn">
      </label>
      <div class="form-row">
        <label>Destination
          <input type="text" id="tripDestination" placeholder="e.g. Kyoto">
        </label>
        <label>Country
          <input type="text" id="tripCountry" list="countryList" placeholder="e.g. Japan">
          <datalist id="countryList"></datalist>
        </label>
      </div>
      <div class="form-row">
        <label>Start date <span class="hint">(blank = bucket list)</span>
          <input type="date" id="tripStart">
        </label>
        <label>End date
          <input type="date" id="tripEnd">
        </label>
      </div>
      <label>Summary
        <textarea id="tripSummary" rows="3" placeholder="What's this trip about?"></textarea>
      </label>
      <label>Tags <span class="hint">(comma-separated)</span>
        <input type="text" id="tripTags" placeholder="e.g. hiking, food, solo">
      </label>
      <label>Cover photo
        <input type="file" accept="image/*" id="tripCoverInput">
      </label>
      <div class="cover-preview" id="tripCoverPreview"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteTripBtn" style="display:none">Delete Trip</button>
        <div class="spacer"></div>
        <button type="button" class="btn" data-close-modal="tripModalOverlay">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Trip</button>
      </div>
    </form>
  </div>
</div>

<!-- Entry Form Modal -->
<div class="modal-overlay" id="entryModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="entryModalTitle">New Journal Entry</h2>
      <button type="button" class="modal-close" data-close-modal="entryModalOverlay">×</button>
    </div>
    <form id="entryForm">
      <input type="hidden" id="entryId">
      <div class="form-row">
        <label>Title
          <input type="text" id="entryTitle" required placeholder="e.g. Arrival &amp; first impressions">
        </label>
        <label>Date
          <input type="date" id="entryDate" required>
        </label>
      </div>
      <div class="form-row">
        <label>Trip <span class="hint">(optional)</span>
          <select id="entryTrip"><option value="">— General note —</option></select>
        </label>
        <label>Location
          <input type="text" id="entryLocation" placeholder="e.g. Fushimi Inari, Kyoto">
        </label>
      </div>
      <label>Journal entry <span class="hint">(write it up like a short story)</span>
        <textarea id="entryBody" rows="8" placeholder="Landed jet-lagged and went straight for the gates anyway…"></textarea>
      </label>
      <label>Key insights <span class="hint">(one per line)</span>
        <textarea id="entryInsights" rows="3" placeholder="Go before 7am to beat the crowds"></textarea>
      </label>
      <label>Photos
        <input type="file" accept="image/*" id="entryPhotosInput" multiple>
      </label>
      <div class="photo-grid" id="entryPhotoPreview"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteEntryBtn" style="display:none">Delete Entry</button>
        <div class="spacer"></div>
        <button type="button" class="btn" data-close-modal="entryModalOverlay">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Entry</button>
      </div>
    </form>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
